<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ECoR-OAMS Help Bot — Ask questions about asset management, transfers, and procedures">
    <title>ECoR-OAMS · Help Bot</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">

    <!-- ═══ SIDEBAR ═══ -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">🚆</div>
            <div>
                <h2>ECoR-OAMS</h2>
                <span>Asset Management</span>
            </div>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Main</div>
                <a href="/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
                <a href="/assets"><span class="nav-icon">📦</span> Assets</a>
                <a href="/transfers"><span class="nav-icon">🔄</span> Transfers</a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">Reports</div>
                <a href="/assets?tab=depreciation"><span class="nav-icon">📉</span> Depreciation</a>
            </div>
            <div class="nav-section auditor-only" style="display:none">
                <div class="nav-section-title">Settings</div>
                <a href="/categories"><span class="nav-icon">⚙️</span> Categories</a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Support</div>
                <a href="/faq" class="active"><span class="nav-icon">🤖</span> Help Bot</a>
                <a href="/report"><span class="nav-icon">🐛</span> Report System Issue</a>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar"></div>
                <div class="user-details">
                    <div class="user-name"></div>
                    <div class="user-role"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ═══ MAIN CONTENT ═══ -->
    <div class="main-content">
        <header class="app-header">
            <div class="header-left">
                <button class="btn btn-ghost btn-icon" id="menuToggle" style="display:none">☰</button>
                <h1>🤖 Help Bot</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-outline btn-sm btn-logout">Logout</button>
            </div>
        </header>

        <div class="page-content">
            <!-- CR-2026-006: Full-page Help Bot chat interface -->
            <div class="helpbot-fullpage" id="helpbotFullpage">
                <div class="helpbot-header">
                    <h2>🤖 ECoR-OAMS Help Bot</h2>
                    <div class="bot-status">Online</div>
                </div>
                <div class="helpbot-messages" id="fullpageBotMessages"></div>
                <div class="helpbot-input-area">
                    <input type="text" id="fullpageBotInput" placeholder="Type your question here… (e.g. 'How do I transfer an asset?')" autocomplete="off">
                    <button id="fullpageBotSend">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/helpbot.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        HelpBot.init('#fullpageBotMessages', '#fullpageBotInput', '#fullpageBotSend');
    });
</script>
</body>
</html>
