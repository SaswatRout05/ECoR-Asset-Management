<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ECoR-OAMS Login — East Coast Railway Office Asset Management System">
    <title>ECoR-OAMS · Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-icon">🚆</div>
                <h1>ECoR-OAMS</h1>
                <p>East Coast Railway · Office Asset Management</p>
            </div>

            <div id="loginError" class="login-error"></div>

            <form class="login-form" id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="emp_id">Employee ID / Username</label>
                    <input
                        type="text"
                        id="emp_id"
                        name="emp_id"
                        placeholder="e.g. ECoR-C-1001 or custodian1"
                        required
                        autofocus
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-accent btn-lg btn-block" id="loginBtn">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 28px; text-align: center; color: rgba(255,255,255,0.35); font-size: 0.72rem;">
                <p>Authorized personnel only · Indian Railways</p>
            </div>
        </div>
    </div>

    <script>
        // Clear any stale auth on login page
        const existing = localStorage.getItem('ecor_token');
        if (existing) {
            // Validate token — if valid, redirect to dashboard
            fetch('/api/auth/me', {
                headers: { 'Authorization': 'Bearer ' + existing }
            }).then(r => {
                if (r.ok) window.location.href = '/dashboard';
                else localStorage.clear();
            }).catch(() => localStorage.clear());
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errDiv = document.getElementById('loginError');

            btn.disabled = true;
            btn.textContent = 'Signing in…';
            errDiv.classList.remove('visible');

            const idVal = document.getElementById('emp_id').value.trim();

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emp_id: idVal,
                        username: idVal,
                        password: document.getElementById('password').value,
                    }),
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || 'Authentication failed');
                }

                const data = await res.json();
                localStorage.setItem('ecor_token', data.access_token);
                localStorage.setItem('ecor_role', data.role);
                localStorage.setItem('ecor_name', data.full_name);

                window.location.href = '/dashboard';
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
